services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Test123
      MYSQL_DATABASE: bankapp
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bankapp-net
    
  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_CPU_AVX2=false
    volumes:
      - ollama-data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /usr/lib/ollama/libggml-cpu-sapphirerapids.so ]; then
          mv /usr/lib/ollama/libggml-cpu-sapphirerapids.so /usr/lib/ollama/libggml-cpu-sapphirerapids.so.bak
        fi
        exec /bin/ollama serve
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bankapp-net

  ollama-pull-model:
    image: ollama/ollama
    environment:
      - OLLAMA_HOST=ollama
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh 
    command: -c "ollama pull tinyllama"
    networks:
      - bankapp-net

  bankapp:
    image: rohit5126/bankapp:latest
    ports:
      - "4173:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: bankapp
      MYSQL_USER: root
      MYSQL_PASSWORD: Test123
      OLLAMA_URL: http://ollama:11434
    depends_on:
      mysql:
        condition: service_healthy
      ollama-pull-model:
        condition: service_completed_successfully
    networks:
      - bankapp-net

volumes:
  mysql-data:
  ollama-data:

networks:  
  bankapp-net:
    driver: bridge

  