apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bankapp-tls
  namespace: newbankapp
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: bankapp-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "bankappai.duckdns.org"