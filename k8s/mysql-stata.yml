apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  type: ClusterIP
  clusterIP: None
  selector:  
    app: mysql-app
  ports:
    - port: 3306
      targetPort: 3306

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-state
  labels: 
    app: mysql-app
spec:
  selector:
    matchLabels:
      app: mysql-app
  serviceName: mysql
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql-app
    spec:
      containers:
        - name: mysql-state
          image: mysql:8.0
          ports:
            - containerPort: 3306
              name: web
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          env:
            - name: MYSQL_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            
            - name: MYSQL_DATABASE
              valueFrom: 
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_DATABASE
          readinessProbe:
            exec:
              command: ["sh","-c", "mysqladmin ping -h localhost -u root -p$MYSQL_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        storageClassName: "standard"
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi

