apiVersion: apps/v1
kind: Deployment
metadata: 
  name: redis-dep
  namespace: newbankapp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels: 
    app: redis
spec: 
  selector: 
    matchLabels:  
      app: redis
  replicas: 1
  template:
    metadata:
      labels: 
        app: redis
    spec: 
      containers:
        - name: redis-pod
          image: redis:7-alpine
          ports:  
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            exec: 
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
  
---

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: newbankapp
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379

            
