name: all-check-passed-PR-update
on:
  pull_request:
      branches: [master]
      types: [opened, synchronize]
  workflow_dispatch: 

permissions:
  pull-requests: write

jobs:
  Code-Quality-Check:
    uses: ./.github/workflows/Code_quality.yml
    with:
      cache: 'maven' 

  Docker-Lint-Scan:
    needs: [Code-Quality-Check]
    uses: ./.github/workflows/docker-lint-scan.yml
    secrets: 
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  Add-comment:
    runs-on: ubuntu-latest
    needs: [Docker-Lint-Scan]
    steps:
      - uses: mshick/add-pr-comment@v3
        with:
          message: |
            ### All CI Checks Completed Successfully
              **All automated validation steps for this pull request have passed.**

              **Completed checks include:**

              * Code quality analysis and liniting(checkstyle)
              * Secret detection scan(git leaks)
              * Dependency vulnerability assessment(trivyScan)
              * Vulnerbility reports created
              * Docker build and lint validation(using trivy image scan)

            **This pull request meets the required quality and security standards and is ready for review and merge.**

  
