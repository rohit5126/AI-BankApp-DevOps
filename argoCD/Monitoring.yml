apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rohit5126/AI-BankApp-DevOps.git
    targetRevision: master
    path: Monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true            
      - ServerSideApply=true
