apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: rohit5126kumar@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.duckdns.org   # was: acme.mycompany.com
            solverName: duckdns
            config:
              apiTokenSecretRef:             # ✓ correct nested structure
                name: duckdns-token
                key: token                # must match the actual key inside the Secret
              zoneName: bankappai